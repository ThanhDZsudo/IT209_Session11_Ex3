name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions

permissions:
  contents: read

jobs:
  ci-pipeline:
    name: Check Syntax, Test & Package JAR
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường JDK 17 (khớp với Java toolchain trong build.gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Cấu hình Gradle & tự động cache dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bước 4: Cấp quyền thực thi cho file gradlew (tránh lỗi permission denied trên Linux runner)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Bước 5: Check cú pháp & Biên dịch mã nguồn (Syntax & Compilation check)
      - name: Check syntax & compile classes
        run: ./gradlew compileJava compileTestJava --info

      # Bước 6: Chạy kiểm thử tự động (Unit Test)
      - name: Run tests
        run: ./gradlew test

      # Bước 7: Đóng gói ứng dụng thành file JAR thực thi (Package JAR)
      - name: Package JAR application
        run: ./gradlew bootJar -x test

      # Bước 8: Upload và lưu trữ file JAR làm Artifact để tải về
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT211_SS5_Ex2-application-jar
          path: build/libs/*.jar
          retention-days: 7
